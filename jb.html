<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>YOVA FLASH</title>
    <style>
      :root {
        --bg-main: #0a0b0e;
        --bg-header: #12141a;
        --bg-card: rgba(18, 20, 26, 0.92);
        --border-color: rgba(255, 122, 0, 0.35);
        --accent-color: #ff7a00;
        --accent-glow: rgba(255, 122, 0, 0.45);
        --text-white: #ffffff;
        --text-muted: #d1d5db;
        --text-dim: #9ca3af;
        --status-ok: #ff9426;
        --status-warn: #ffb84d;
        --status-bad: #ff4d4d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: var(--bg-main);
        background-image:
          radial-gradient(circle at 50% 0%, rgba(255, 122, 0, 0.12) 0%, transparent 55%),
          radial-gradient(circle at 10% 90%, rgba(255, 122, 0, 0.06) 0%, transparent 45%);
        color: var(--text-white);
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #brand {
        text-align: center;
        padding: 12px 16px;
        background: var(--bg-header);
        border-bottom: 2px solid var(--accent-color);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px var(--accent-glow);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      #brand img {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid var(--accent-color);
        box-shadow: 0 0 10px var(--accent-glow);
        object-fit: cover;
        vertical-align: middle;
      }

      #brand b {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: var(--text-white);
        text-transform: uppercase;
        vertical-align: middle;
      }

      /* running: a spinner under the brand */
      #spin {
        position: fixed;
        top: calc(50% - 35px);
        left: 50%;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border: 4px solid rgba(255, 122, 0, 0.2);
        border-top-color: var(--accent-color);
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
        box-shadow: 0 0 20px var(--accent-glow);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #status-msg {
        position: fixed;
        top: calc(50% + 45px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-white);
        letter-spacing: 0.04em;
      }

      #status-msg span {
        color: var(--accent-color);
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 18px;
        font-weight: 800;
        color: var(--text-white);
        background: var(--bg-card);
        border: 1.5px solid var(--status-bad);
        border-radius: 16px;
        padding: 24px 36px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 77, 77, 0.3);
        display: none;
        letter-spacing: 0.5px;
      }

      #done-msg {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        display: none;
        background: var(--bg-card);
        border: 1.5px solid var(--accent-color);
        border-radius: 16px;
        padding: 28px 40px;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.7), 0 0 25px var(--accent-glow);
      }

      #done-msg .title {
        font-size: 24px;
        font-weight: 800;
        color: var(--text-white);
        margin-bottom: 6px;
        text-shadow: 0 0 16px var(--accent-glow);
      }

      #done-msg .desc {
        font-size: 15px;
        color: var(--status-ok);
        font-weight: 700;
      }

      #wrap {
        padding: 0;
      }

      #state,
      #out {
        display: none;
      }

      body.done #spin,
      body.done #status-msg {
        display: none;
      }

      body.done #done-msg {
        display: block;
      }

      body.fail #spin,
      body.fail #status-msg {
        display: none;
      }

      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log */
      body.log #spin,
      body.log #status-msg,
      body.log #msg,
      body.log #done-msg {
        display: none;
      }

      body.log #wrap {
        padding: 20px;
        max-width: 900px;
        margin: 0 auto;
      }

      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 800;
        color: var(--text-white);
        margin: 0 0 10px;
      }

      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          13px/1.45 Consolas,
          monospace;
        background: #0d0f14;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px 16px;
        height: calc(100vh - 145px);
        overflow-y: auto;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
      }

      .ok {
        color: var(--status-ok);
        font-weight: 700;
      }
      .bad {
        color: var(--status-bad);
        font-weight: 700;
      }
      .warn {
        color: var(--status-warn);
        font-weight: 700;
      }
      .safe {
        color: var(--status-ok);
      }
      .danger {
        color: var(--status-bad);
      }
      code {
        color: #ffd000;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <img
        src="logo_raw.png"
        alt="Logo"
        width="34"
        height="34"
      /><b>YOVA FLASH</b><img
        src="flag.png"
        alt="Algeria Flag"
        width="34"
        height="34"
      />
    </div>
    <div id="spin"></div>
    <div id="status-msg"><span>⚡</span> Jailbreak in progress... please wait</div>
    <div id="msg">⚠️ Restart your console</div>
    <div id="done-msg">
      <div class="title">🎉 Jailbreak Complete!</div>
      <div class="desc">GoldHEN is active &amp; ready</div>
    </div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
