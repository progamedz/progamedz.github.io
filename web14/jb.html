<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PRO-GAME — PS4 14.00 GoldHEN</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
        padding: 8px 10px;
        background: #0e1116;
        border-bottom: 1px solid #1e2732;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: #7fd0a0;
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    
      #ramBox {
        position: fixed;

        top: 8px;
        left: 8px;
        z-index: 9999;

        padding: 6px 9px;

        color: #7fd0a0;
        background: rgba(0, 0, 0, 0.78);

        border:
          1px solid #1e2732;

        border-radius: 4px;

        font-family:
          Consolas,
          monospace;

        font-size: 11px;

        max-width: 92vw;
        overflow: hidden;

        text-overflow: ellipsis;
        white-space: nowrap;
      }

    </style>
  </head>
  <body>
    <div id="ramBox">RAM: checking...</div>
    <div id="brand" style="display:flex; align-items:center; justify-content:center; gap:12px; background:#0a0c10; border-bottom:2px solid #00c8ff; padding:10px 16px;">
      <a href="https://www.tiktok.com/@pro.game.elharrach" target="_blank" style="display:inline-flex; align-items:center; text-decoration:none;">
        <img src="logo_raw.png" alt="PRO-GAME Logo" width="38" height="38" style="border-radius:50%; border:2px solid #00c8ff; box-shadow:0 0 10px rgba(0,200,255,0.5); object-fit:cover; vertical-align:middle;">
      </a>
      <b style="font-size:18px; font-weight:800; letter-spacing:0.12em; color:#ffffff; text-transform:uppercase; vertical-align:middle;">PRO-GAME &middot; 14.00 GoldHEN</b>
      <a href="https://www.tiktok.com/@yova2flash" target="_blank" style="display:inline-flex; align-items:center; text-decoration:none;">
        <img src="logo2.jpeg" alt="YOVA FLASH Logo" width="38" height="38" style="border-radius:50%; border:2px solid #00c8ff; box-shadow:0 0 10px rgba(0,200,255,0.5); object-fit:cover; vertical-align:middle;">
      </a>
      <a href="https://www.tiktok.com/@pro.game.elharrach" target="_blank" style="display:inline-flex; align-items:center; gap:6px; background:rgba(0,180,255,0.15); color:#00e5ff; border:1px solid #00c8ff; border-radius:18px; padding:4px 12px; font-size:12px; font-weight:700; text-decoration:none; vertical-align:middle;">
        <span>TikTok</span>
      </a>
    </div>

    <!-- Custom Top-Left GoldHEN Popup Notification -->
    <div id="ps-notify" style="display:none; position:fixed; top:20px; left:20px; z-index:999999; background:rgba(10,12,16,0.96); border:2px solid #00c8ff; border-radius:12px; padding:12px 18px; box-shadow:0 0 25px rgba(0,200,255,0.6), 0 8px 30px rgba(0,0,0,0.9); align-items:center; gap:14px; font-family:'Segoe UI',system-ui,sans-serif;">
      <img src="logo_raw.png" style="width:40px; height:40px; border-radius:50%; border:2px solid #00c8ff; object-fit:cover;">
      <div>
        <div style="font-size:11px; color:#00e5ff; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Jailbreak Notification</div>
        <div style="font-size:15px; color:#ffffff; font-weight:800; letter-spacing:0.5px;">⚡ Jailbreak by PRO-GAME</div>
      </div>
    </div>

    <script>
    function showCustomNotification() {
      var n = document.getElementById("ps-notify");
      if (!n) return;
      n.style.display = "flex";
      setTimeout(function() {
        n.style.transition = "opacity 0.8s ease, transform 0.8s ease";
        n.style.opacity = "0";
        n.style.transform = "translateY(-20px)";
        setTimeout(function() { try { n.remove(); } catch(e){} }, 800);
      }, 7000);
    }
    window.showCustomNotification = showCustomNotification;
    </script>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=stage10s-1";
    </script>
  </body>
</html>
