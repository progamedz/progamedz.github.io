<script>
if (window.applicationCache) {
    history.replaceState(null, null, 'index.html');
    if (/PlayStation 4/i.test(navigator.userAgent)) {
        var histlength = history.length;
        if (histlength > 0) history.go(-histlength);
    }
    function DLProgress(e) {
        var Percent = Math.round((e.loaded / e.total) * 100);
        var m = document.getElementById("msgs");
        if (m) m.innerHTML = "Installing Offline Cache: " + Percent + "%";
    }
    function DisplayCacheProgress() {
        var m = document.getElementById("msgs");
        if (m) {
            m.innerHTML = "Cache Installed Successfully ✔";
            setTimeout(function () {
                m.innerHTML = "Now Close And Re-Open Your Browser ...";
            }, 1500);
        }
    }
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function (e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
    window.applicationCache.onerror = function (e) {
        var m = document.getElementById("msgs");
        if (m) m.innerHTML = "Error Installing Cache! - Clear and Re-Open Your Browser ...";
    };
} else {
    document.addEventListener("DOMContentLoaded", function () {
        var m = document.getElementById("msgs");
        if (m) {
            m.innerHTML = "Offline Cache is active for PS4 consoles.<br><span style='font-size:14px;color:#d1d5db;font-weight:400;'>Ready for PS4 &middot; Testing on Browser</span><br><br><a href='index.html' style='display:inline-block;background:#00c8ff;color:#000;font-size:15px;font-weight:700;padding:8px 20px;border-radius:4px;text-decoration:none;'>&larr; Return to Host Menu</a>";
        }
    });
}
