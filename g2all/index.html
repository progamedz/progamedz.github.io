<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOVA FLASH - PS4 [5.05] 7.00 - 13.00 FW GoldHEN Host</title>
<link rel="stylesheet" href="style.css?v=orange">
<style>
:root {
  --bg-main: #0a0b0e;
  --bg-header: #12141a;
  --bg-card: rgba(18, 20, 26, 0.92);
  --border-color: rgba(255, 122, 0, 0.35);
  --accent-color: #ff7a00;
  --accent-glow: rgba(255, 122, 0, 0.45);
  --text-white: #ffffff;
  --text-muted: #d1d5db;
  --text-dim: #9ca3af;
  --status-ok: #ff9426;
  --status-warn: #ffb84d;
  --status-bad: #ff4d4d;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: var(--bg-main) !important;
  background-image:
    radial-gradient(circle at 50% 0%, rgba(255, 122, 0, 0.12) 0%, transparent 55%),
    radial-gradient(circle at 10% 90%, rgba(255, 122, 0, 0.06) 0%, transparent 45%) !important;
  color: var(--text-white);
  font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  text-align: center;
  -webkit-font-smoothing: antialiased;
}

#brand {
  text-align: center;
  padding: 12px 16px;
  background: var(--bg-header);
  border-bottom: 2px solid var(--accent-color) !important;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px var(--accent-glow) !important;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 24px;
}

#brand img {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--accent-color) !important;
  box-shadow: 0 0 10px var(--accent-glow) !important;
  object-fit: cover;
  vertical-align: middle;
}

#brand b {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.15em;
  color: var(--text-white);
  text-transform: uppercase;
  vertical-align: middle;
}

.main-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text-white);
  margin: 20px 10px 8px;
  letter-spacing: 0.03em;
}

.sub-title {
  font-size: 14px;
  color: var(--accent-color) !important;
  font-weight: 700;
  margin-bottom: 20px;
  letter-spacing: 0.05em;
}

#msgs {
  font-size: 18px;
  font-weight: 800;
  color: var(--status-warn) !important;
  line-height: 1.5;
  margin-bottom: 16px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  min-height: 26px;
}

.btn-menu {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  max-width: 760px;
  margin: 10px auto 30px;
}

.btn {
  background: #12141c;
  color: #ffffff;
  width: 227px;
  height: 48px;
  font-size: 18px;
  font-weight: 700;
  border: 1.5px solid rgba(255, 122, 0, 0.4) !important;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-family: inherit;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
}

.btn:hover, .btn:focus {
  background: #ff7a00 !important;
  color: #000000 !important;
  border-color: #ff9426 !important;
  box-shadow: 0 0 20px var(--accent-glow) !important;
  transform: translateY(-2px);
}

.btn.btn-multi {
  background: #ff7a00 !important;
  color: #ffffff !important;
  border: 1.5px solid #ff9426 !important;
  box-shadow: 0 0 16px var(--accent-glow) !important;
  font-weight: 800;
}

.btn.btn-multi:hover, .btn.btn-multi:focus {
  background: #ffa033 !important;
  color: #000000 !important;
  box-shadow: 0 0 24px var(--accent-glow) !important;
  transform: translateY(-2px);
}

/* BLUE BUTTON: ⚡ 13.02 - 13.52 Host */
.btn.btn-host {
  background: linear-gradient(135deg, #0066ff 0%, #00c8ff 100%) !important;
  color: #ffffff !important;
  border: 1.5px solid #00e5ff !important;
  box-shadow: 0 0 20px rgba(0, 170, 255, 0.7) !important;
  font-weight: 800;
}

.btn.btn-host:hover, .btn.btn-host:focus {
  background: linear-gradient(135deg, #0088ff 0%, #33e0ff 100%) !important;
  color: #000000 !important;
  border-color: #ffffff !important;
  box-shadow: 0 0 28px rgba(0, 220, 255, 0.95) !important;
  transform: translateY(-2px);
}
</style>
</head>
<body>
<div id="brand">
  <img src="logo_raw.png" alt="Logo" width="34" height="34">
  <b>YOVA FLASH</b>
  <img src="flag.png" alt="Algeria Flag" width="34" height="34">
</div>

<h1 class="main-title">PS4 [5.05] 7.00 - 13.00 FW GoldHEN Host</h1>
<div class="sub-title">YOVA FLASH Multi-Firmware Host</div>

<div style="text-align:center; margin: 25px auto 40px;">
  <h1 id="msgs" style="font-size: 18px; color: var(--status-warn); font-weight: 800; margin-bottom: 16px; letter-spacing: 0.05em; text-transform: uppercase; min-height: 26px;">
    Select Your Firmware
  </h1>
  <div class="btn-menu">
    <button type="button" class="btn btn-multi" onclick="autoLaunch()" onmouseover="setMsg('PS4 GoldHEN Auto-Exploit for 5.05 and 7.00 to 13.00 FW')" onmouseout="resetMsg()">GoldHEN Auto Exploit</button>
    <button type="button" class="btn" onclick="launchPayload(505)" onmouseover="setMsg('PS4 5.05 / 5.07 FW GoldHEN Host')" onmouseout="resetMsg()">5.05 / 5.07 FW</button>
    <button type="button" class="btn" onclick="launchPayload(700)" onmouseover="setMsg('PS4 7.00 - 8.52 FW GoldHEN Host')" onmouseout="resetMsg()">7.00 - 8.52 FW</button>
    <button type="button" class="btn" onclick="launchPayload(900)" onmouseover="setMsg('PS4 9.00 - 9.60 FW GoldHEN Host (psfree)')" onmouseout="resetMsg()">9.00 - 9.60 FW</button>
    <button type="button" class="btn" onclick="launchPayload(1000)" onmouseover="setMsg('PS4 10.00 - 11.02 FW GoldHEN Host (WebKit)')" onmouseout="resetMsg()">10.00 - 11.02 FW</button>
    <button type="button" class="btn" onclick="launchPayload(1150)" onmouseover="setMsg('PS4 11.50 - 12.02 FW GoldHEN Host (slopkit)')" onmouseout="resetMsg()">11.50 - 12.02 FW</button>
    <button type="button" class="btn" onclick="launchPayload(1250)" onmouseover="setMsg('PS4 12.50 - 13.00 FW GoldHEN Host (slopkit)')" onmouseout="resetMsg()">12.50 - 13.00 FW</button>
    <a href="../index.html" class="btn btn-host" onmouseover="setMsg('Switch to 13.02 - 13.52 Exploit Host')" onmouseout="resetMsg()">⚡ 13.02 - 13.52 Host</a>
  </div>
</div>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    var m = document.getElementById("msgs");
    if (m) m.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

function setMsg(txt) {
    var m = document.getElementById("msgs");
    if (m) m.innerHTML = txt;
}

function resetMsg() {
    var m = document.getElementById("msgs");
    if (!m) return;
    if (isPS4) {
        m.innerHTML = "PS4 Firmware <b>" + fwVersion + "</b> Detected &middot; Select Your Firmware";
    } else {
        m.innerHTML = "Select Your Firmware";
    }
}

function getCacheTarget(fw) {
    if (fw == 505) return "cache505.html";
    if (fw == 700) return "cache700.html";
    if (fw == 900) return "cache900.html";
    if (fw == 1000) return "cachecss.html";
    return "cacheslopkit.html";
}

function launchPayload(fw) {
    var cachePage = getCacheTarget(fw);
    var ac = window.applicationCache;
    var isCached = (ac && ac.status !== 0 && ac.status !== undefined);

    // On desktop PC / testing environment: navigate to the cache installer page
    if (!isPS4) {
        setMsg("Opening Cache Installer for FW " + (fw == 1000 ? "10.00 - 11.02" : fw == 1150 ? "11.50 - 12.02" : fw == 1250 ? "12.50 - 13.00" : fw == 900 ? "9.00 - 9.60" : fw == 700 ? "7.00 - 8.52" : "5.05 / 5.07") + "...");
        setTimeout(function () {
            window.location.href = cachePage;
        }, 200);
        return;
    }

    // On PS4 uncached: install offline cache first
    if (!isCached) {
        setMsg("Redirecting to Cache Installation for FW " + fw + "... Please Wait");
        setTimeout(function () {
            window.location.replace(cachePage);
        }, 200);
        return;
    }

    // On PS4 cached: launch payload
    setMsg("Loading GoldHEN v2.4b18.10... Please Wait");

    try {
        if (fw == 505) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fw == 700) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fw == 900) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fw == 1000) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    if (typeof doJb === 'function') doJb();
                }, 500);
            };
            document.head.appendChild(script);
        } else if (fw == 1150) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fw == 1250) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    } catch (err) {
        setMsg("Error launching payload: " + (err && err.message ? err.message : err));
    }
}

function autoLaunch() {
    if (!isPS4) {
        setMsg("Auto-Detection requires PS4 console &middot; Select your firmware manually below");
        return;
    }
    if (fwNum == 5.05 || fwNum == 5.07) {
        launchPayload(505);
    } else if (fwNum >= 7.00 && fwNum <= 8.52) {
        launchPayload(700);
    } else if (fwNum >= 9.00 && fwNum <= 9.60) {
        launchPayload(900);
    } else if (fwNum >= 10.00 && fwNum <= 11.02) {
        launchPayload(1000);
    } else if (fwNum >= 11.50 && fwNum <= 12.02) {
        launchPayload(1150);
    } else if (fwNum >= 12.50 && fwNum <= 13.00) {
        launchPayload(1250);
    } else if (fwNum >= 13.02 && fwNum <= 13.52) {
        setMsg("PS4 FW " + fwVersion + " Detected &middot; Redirecting to 13.02 - 13.52 Host...");
        setTimeout(function () {
            window.location.href = "../index.html";
        }, 600);
    } else {
        setMsg('Unsupported Firmware: <span style="color: #ff4d4d;">' + fwVersion + '</span> &middot; Select an option below');
    }
}

resetMsg();
</script>
</body>
</html>
