<div style="text-align:center; margin: 25px auto 40px;">
  <h1 id="msgs">
    Select Your Firmware
  </h1>
  <div class="btn-menu">
    <button type="button" class="btn btn-multi" onclick="autoLaunch()" onmouseover="setMsg('PS4 GoldHEN Auto-Exploit for 5.05 and 7.00 to 13.00 FW')" onmouseout="resetMsg()">GoldHEN Auto Exploit</button>
    <button type="button" class="btn" onclick="launchPayload(505)" onmouseover="setMsg('PS4 5.05 / 5.07 FW GoldHEN Host')" onmouseout="resetMsg()">5.05 / 5.07 FW</button>
    <button type="button" class="btn" onclick="launchPayload(700)" onmouseover="setMsg('PS4 7.00 - 8.52 FW GoldHEN Host')" onmouseout="resetMsg()">7.00 - 8.52 FW</button>
    <button type="button" class="btn" onclick="launchPayload(900)" onmouseover="setMsg('PS4 9.00 - 9.60 FW GoldHEN Host (psfree)')" onmouseout="resetMsg()">9.00 - 9.60 FW</button>
    <button type="button" class="btn" onclick="launchPayload(1000)" onmouseover="setMsg('PS4 10.00 - 11.02 FW GoldHEN Host (WebKit)')" onmouseout="resetMsg()">10.00 - 11.02 FW</button>
    <button type="button" class="btn" onclick="launchPayload(1150)" onmouseover="setMsg('PS4 11.50 - 12.02 FW GoldHEN Host (slopkit)')" onmouseout="resetMsg()">11.50 - 12.02 FW</button>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    var m = document.getElementById("msgs");
    if (m) m.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

function setMsg(txt) {
    var m = document.getElementById("msgs");
    if (m) m.innerHTML = txt;
}

function resetMsg() {
    var m = document.getElementById("msgs");
    if (!m) return;
    if (isPS4) {
        m.innerHTML = "PS4 Firmware <b>" + fwVersion + "</b> Detected &middot; Select Your Firmware";
    } else {
        m.innerHTML = "Select Your Firmware";
    }
}

function getCacheTarget(fw) {
    if (fw == 505) return "cache505.html";
    if (fw == 700) return "cache700.html";
    if (fw == 900) return "cache900.html";
    if (fw == 1000) return "cachecss.html";
    return "cacheslopkit.html";
}

function launchPayload(fw) {
    var cachePage = getCacheTarget(fw);
    var ac = window.applicationCache;
    var isCached = (ac && ac.status !== 0 && ac.status !== undefined);

    // On desktop PC / testing environment: navigate to the cache installer page
    if (!isPS4) {
        setMsg("Opening Cache Installer for FW " + (fw == 1000 ? "10.00 - 11.02" : fw == 1150 ? "11.50 - 12.02" : fw == 1250 ? "12.50 - 13.00" : fw == 900 ? "9.00 - 9.60" : fw == 700 ? "7.00 - 8.52" : "5.05 / 5.07") + "...");
        setTimeout(function () {
            window.location.href = cachePage;
        }, 200);
        return;
    }

    // On PS4 uncached: install offline cache first
    if (!isCached) {
        setMsg("Redirecting to Cache Installation for FW " + fw + "... Please Wait");
        setTimeout(function () {
            window.location.replace(cachePage);
        }, 200);
        return;
    }

    // On PS4 cached: launch payload
    setMsg("Loading GoldHEN v2.4b18.10... Please Wait");

    try {
        if (fw == 505) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fw == 700) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fw == 900) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fw == 1000) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    if (typeof doJb === 'function') doJb();
                }, 500);
            };
            document.head.appendChild(script);
        } else if (fw == 1150) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fw == 1250) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    } catch (err) {
        setMsg("Error launching payload: " + (err && err.message ? err.message : err));
    }
}

function autoLaunch() {
    if (!isPS4) {
        setMsg("Auto-Detection requires PS4 console &middot; Select your firmware manually below");
        return;
    }
    if (fwNum == 5.05 || fwNum == 5.07) {
        launchPayload(505);
    } else if (fwNum >= 7.00 && fwNum <= 8.52) {
        launchPayload(700);
    } else if (fwNum >= 9.00 && fwNum <= 9.60) {
        launchPayload(900);
    } else if (fwNum >= 10.00 && fwNum <= 11.02) {
        launchPayload(1000);
    } else if (fwNum >= 11.50 && fwNum <= 12.02) {
        launchPayload(1150);
    } else if (fwNum >= 12.50 && fwNum <= 13.00) {
        launchPayload(1250);
    } else if (fwNum >= 13.02 && fwNum <= 13.52) {
        setMsg("PS4 FW " + fwVersion + " Detected &middot; Redirecting to 13.02 - 13.52 Host...");
        setTimeout(function () {
            window.location.href = "../index.html";
        }, 600);
    } else {
        setMsg('Unsupported Firmware: <span style="color: #ff4d4d;">' + fwVersion + '</span> &middot; Select an option below');
    }
}

resetMsg();
