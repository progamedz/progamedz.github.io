<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOVA FLASH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="brand">
  <img src="logo.jpeg" alt="Logo" class="brand-logo" onerror="this.src='logo_raw.png'">
  <b>YOVA FLASH</b>
  <img src="flag.png" alt="Flag" class="brand-flag">
  
  <a href="https://www.tiktok.com/@yova2flash" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:6px; color:var(--text-main); text-decoration:none; font-weight:700; font-size:0.9rem; margin-left:12px; background:rgba(255,122,0,0.15); border:1px solid var(--accent-color); padding:4px 10px; border-radius:20px;" title="Follow on TikTok @yova2flash">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="color:var(--accent-color);"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 1 1-5.2-1.74 2.89 2.89 0 0 1 2.31-1.42V8.9a6.34 6.34 0 0 0-5.6 6.33 6.34 6.34 0 1 0 11.94-2.58V8.75a8.21 8.21 0 0 0 4.77 1.48V6.78a4.85 4.85 0 0 1-1.0-.09z"/></svg>
    <span>@yova2flash</span>
  </a>
</div>

<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>

  <div class="btn-group" id="btnGroup">
    <button type="button" class="action-btn gold-btn" id="btnGold">
      <span>⚡ Launch GoldHEN</span>
      <span class="sub">v2.4b18.11 &middot; Press (□ / △)</span>
    </button>
    <button type="button" class="action-btn" id="btnHen">
      <span>🚀 Launch PS4-HEN</span>
      <span class="sub">Standard &middot; Press (X)</span>
    </button>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var btnGold = document.getElementById("btnGold");
    var btnHen = document.getElementById("btnHen");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares supported across the exploit chain
    var SUPPORTED = {
        900: 1, 903: 1, 904: 1, 950: 1, 960: 1,
        1000: 1, 1001: 1, 1050: 1, 1070: 1, 1071: 1,
        1100: 1, 1102: 1, 1150: 1, 1152: 1,
        1200: 1, 1202: 1, 1250: 1, 1252: 1,
        1300: 1, 1302: 1, 1304: 1, 1350: 1, 1352: 1
    };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var timer = null;
    function cancelTimer() {
        if (timer) { clearInterval(timer); timer = null; }
    }

    function launchGoldHen() {
        cancelTimer();
        setState("loading GoldHEN v2.4b18.11...", "warn");
        var p = new URLSearchParams(location.search);
        p.set("payload", "goldhen.bin");
        location.replace("jb.html?" + p.toString());
    }

    function launchHen() {
        cancelTimer();
        setState("loading PS4-HEN (Standard)...", "warn");
        var p = new URLSearchParams(location.search);
        p.set("payload", "payload2.bin");
        location.replace("jb.html?" + p.toString());
    }

    if (btnGold) {
        btnGold.addEventListener("click", function (e) {
            e.stopPropagation();
            launchGoldHen();
        });
    }
    if (btnHen) {
        btnHen.addEventListener("click", function (e) {
            e.stopPropagation();
            launchHen();
        });
    }

    function scheduleAutoLaunch(seconds) {
        if (params.get("payload") === "payload2.bin") {
            launchHen();
            return;
        } else if (params.get("payload") === "goldhen.bin") {
            launchGoldHen();
            return;
        }
        var preferGold = (fwnum === 1352 || params.get("gold") === "1");
        var targetName = preferGold ? "GoldHEN" : "PS4-HEN";
        var count = seconds;
        setState("Auto-launching " + targetName + " in " + count + "s...", "ok");
        timer = setInterval(function () {
            count--;
            if (count <= 0) {
                cancelTimer();
                if (preferGold) launchGoldHen();
                else launchHen();
            } else {
                setState("Auto-launching " + targetName + " in " + count + "s...", "ok");
            }
        }, 1000);
    }

    function waitForTap(msg, action) {
        cancelTimer();
        setState(msg, "warn");
        function fire(e) {
            if (e && e.target && e.target.closest && e.target.closest(".action-btn")) return;
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Controller button listeners (DualShock 4)
    var lastB0 = false, lastB2 = false, lastB3 = false;
    function pollGamepad() {
        var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (var i = 0; i < gamepads.length; i++) {
            var gp = gamepads[i];
            if (gp && gp.buttons) {
                // Cross (X) -> PS4-HEN Standard
                var b0 = gp.buttons[0] && (gp.buttons[0].pressed || gp.buttons[0].value > 0.5);
                if (b0 && !lastB0) {
                    lastB0 = true;
                    launchHen();
                    return;
                }
                lastB0 = b0;

                // Square (2) or Triangle (3) -> GoldHEN v2.4b18.11
                var b2 = gp.buttons[2] && (gp.buttons[2].pressed || gp.buttons[2].value > 0.5);
                var b3 = gp.buttons[3] && (gp.buttons[3].pressed || gp.buttons[3].value > 0.5);
                if ((b2 && !lastB2) || (b3 && !lastB3)) {
                    lastB2 = b2;
                    lastB3 = b3;
                    launchGoldHen();
                    return;
                }
                lastB2 = b2;
                lastB3 = b3;
            }
        }
        requestAnimationFrame(pollGamepad);
    }
    if (navigator.getGamepads) requestAnimationFrame(pollGamepad);

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", launchGoldHen);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        scheduleAutoLaunch(4);
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        scheduleAutoLaunch(3);
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        scheduleAutoLaunch(4);
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            scheduleAutoLaunch(4);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            scheduleAutoLaunch(4);
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            scheduleAutoLaunch(4);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            scheduleAutoLaunch(4);
        }, false);
    }
})();
</script>
</body>
</html>
